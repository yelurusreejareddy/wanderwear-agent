<!--
review.html -- a small, real, throwaway tool, NOT the real app frontend
(that's phase 13, built with React later). Just a plain HTML page you
open directly in your browser (double-click it, or drag it into a tab)
to see every real photo next to its draft label and fix anything wrong.

Real, phase 10 security fix: this used to read wardrobe_items straight
from Supabase using the public anon key. Once the real photo buckets
were locked down to private, that stopped working for images, only a
real, privileged service-role key can generate a real signed URL, and
that key must never live in a plain file a browser can read. So photo
LOADING now goes through the real local API server instead
(agent/api.py's /wardrobe and /inspiration), which holds that
privileged key safely on the backend. SAVING an edit still talks to
Supabase directly with the public anon key, that part was always safe,
it only ever touches real text fields, never a real photo.
-->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Wardrobe + Inspiration Review</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #faf9f7; margin: 0; padding: 20px; }
  h1 { font-size: 20px; }
  .tabs { margin-bottom: 16px; }
  .tabs button { padding: 8px 16px; margin-right: 8px; border: 1px solid #ccc; background: white; cursor: pointer; border-radius: 6px; }
  .tabs button.active { background: #333; color: white; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .card { background: white; border: 1px solid #eee; border-radius: 8px; padding: 10px; }
  .card img { width: 100%; height: 220px; object-fit: cover; border-radius: 6px; background: #eee; }
  .card input, .card textarea { width: 100%; box-sizing: border-box; margin-top: 6px; padding: 6px; font-size: 13px; border: 1px solid #ddd; border-radius: 4px; }
  .card button { margin-top: 6px; padding: 6px 10px; font-size: 13px; cursor: pointer; }
  .status { font-size: 12px; margin-left: 8px; color: #2a7a2a; }
  .filename { font-size: 11px; color: #999; margin-top: 4px; word-break: break-all; }
</style>
</head>
<body>

<h1>Real wardrobe + inspiration review</h1>
<div class="tabs">
  <button id="tab-wardrobe" class="active" onclick="showTab('wardrobe')">Wardrobe (owned)</button>
  <button id="tab-inspiration" onclick="showTab('inspiration')">Inspiration (saved styles)</button>
</div>

<div id="grid-wardrobe" class="grid"></div>
<div id="grid-inspiration" class="grid" style="display:none;"></div>

<script>
const SUPABASE_URL = "https://jjjpcjzymegqjiqfnadu.supabase.co";
const SUPABASE_KEY = "sb_publishable_9hYCLWzspXQ-VkCXs7ygOA_Uk0vKpqu";
const API_URL = "http://127.0.0.1:8811";

const HEADERS = {
  "apikey": SUPABASE_KEY,
  "Authorization": "Bearer " + SUPABASE_KEY,
  "Content-Type": "application/json",
};

function showTab(name) {
  document.getElementById("grid-wardrobe").style.display = name === "wardrobe" ? "grid" : "none";
  document.getElementById("grid-inspiration").style.display = name === "inspiration" ? "grid" : "none";
  document.getElementById("tab-wardrobe").classList.toggle("active", name === "wardrobe");
  document.getElementById("tab-inspiration").classList.toggle("active", name === "inspiration");
}

async function loadWardrobe() {
  // Real photos, real signed URLs, generated fresh by our own real
  // backend, which is the only thing allowed to hold the privileged
  // key that can do that. Never fetched straight from Supabase anymore.
  const res = await fetch(`${API_URL}/wardrobe`);
  const items = await res.json();
  const grid = document.getElementById("grid-wardrobe");
  grid.innerHTML = "";

  for (const item of items) {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <img src="${item.photo_url}" loading="lazy">
      <input data-field="category" value="${escapeHtml(item.category || "")}" placeholder="category">
      <input data-field="color" value="${escapeHtml(item.color || "")}" placeholder="color">
      <textarea data-field="style_notes" rows="2" placeholder="style notes">${escapeHtml(item.style_notes || "")}</textarea>
      <button onclick="saveWardrobe(${item.id}, this)">Save</button>
      <span class="status"></span>
      <div class="filename">${escapeHtml(item.file_name)}</div>
    `;
    grid.appendChild(card);
  }
}

async function saveWardrobe(id, button) {
  const card = button.closest(".card");
  const body = {
    category: card.querySelector('[data-field="category"]').value,
    color: card.querySelector('[data-field="color"]').value,
    style_notes: card.querySelector('[data-field="style_notes"]').value,
  };
  await fetch(`${SUPABASE_URL}/rest/v1/wardrobe_items?id=eq.${id}`, {
    method: "PATCH",
    headers: { ...HEADERS, "Prefer": "return=minimal" },
    body: JSON.stringify(body),
  });
  card.querySelector(".status").textContent = "saved";
  setTimeout(() => { card.querySelector(".status").textContent = ""; }, 2000);
}

async function loadInspiration() {
  // Same real reason as loadWardrobe: real signed URLs from our own
  // backend, not a direct, now-blocked call to Supabase.
  const res = await fetch(`${API_URL}/inspiration`);
  const items = await res.json();
  const grid = document.getElementById("grid-inspiration");
  grid.innerHTML = "";

  for (const item of items) {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <img src="${item.photo_url}" loading="lazy">
      <textarea data-field="description" rows="3" placeholder="description">${escapeHtml(item.description || "")}</textarea>
      <input data-field="source_brand" value="${escapeHtml(item.source_brand || "")}" placeholder="brand (real, if visible)">
      <input data-field="source_product_name" value="${escapeHtml(item.source_product_name || "")}" placeholder="product name (real, if visible)">
      <input data-field="product_url" value="${escapeHtml(item.product_url || "")}" placeholder="real buy link, if you have one">
      ${item.product_url ? `<a href="${escapeHtml(item.product_url)}" target="_blank" style="font-size:12px;">open link</a>` : ""}
      <button onclick="saveInspiration(${item.id}, this)">Save</button>
      <span class="status"></span>
      <div class="filename">${escapeHtml(item.file_name)}</div>
    `;
    grid.appendChild(card);
  }
}

async function saveInspiration(id, button) {
  const card = button.closest(".card");
  const body = {
    description: card.querySelector('[data-field="description"]').value,
    source_brand: card.querySelector('[data-field="source_brand"]').value || null,
    source_product_name: card.querySelector('[data-field="source_product_name"]').value || null,
    product_url: card.querySelector('[data-field="product_url"]').value || null,
  };
  await fetch(`${SUPABASE_URL}/rest/v1/style_inspiration?id=eq.${id}`, {
    method: "PATCH",
    headers: { ...HEADERS, "Prefer": "return=minimal" },
    body: JSON.stringify(body),
  });
  card.querySelector(".status").textContent = "saved";
  setTimeout(() => { card.querySelector(".status").textContent = ""; }, 2000);
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

loadWardrobe();
loadInspiration();
</script>

</body>
</html>
